# ------------------------------------------------------------------------------------
# RADIO_DATA
# ------------------------------------------------------------------------------------
# This section defines the content and behavior of each radio station in the game.
#
# Keys:
#   - Each key represents a unique station slug (e.g., "station_news_88_3").
#   - These slugs must match those listed in RADIO_MAP_LISTS to be accessible.
#
# Values:
#   - Each station can define:
#       - `default`: A fallback broadcast used when no conditions are met.
#       - `conditional_broadcasts`: A prioritized list of broadcasts triggered by
#         specific game conditions (e.g., quest progress, time of day, location).
#       - `frequency`: (Optional) A float value representing the station's FM frequency
#         in MHz. Used by the tuner interface to match stations based on dial position.
#
# Conditional Broadcasts:
#   - Each broadcast includes:
#       - `conditions`: A dictionary of game variables (and optionally map_slugs)
#         that must match for the broadcast to trigger.
#       - `dialogue`: A list of message IDs to display.
#       - `set_variables`: Optional variables to update after the broadcast.
#
# Notes:
#   - Broadcasts are evaluated in order; the first matching one is used. Put the
#     most specific broadcasts first and leave broader ones as a fallback.
#   - If no conditions match, the `default` dialogue is used.
#   - This structure allows dynamic storytelling and reactive radio content.
#   - Stations without a `frequency` will not be accessible via the tuner interface.
#   - Game variable values are strings, so quote them ("true", not True).
#   - `map_slugs` and each entry under `variables` accept either a single value
#     or a list of accepted values, e.g. weekday: [saturday, sunday].
#   - Time variables such as `stage_of_day`, `weekday` and `season` are refreshed
#     by the `update_time` action, which runs on every map transition.
#   - A condition on a variable that has never been set simply does not match, so
#     keep an unconditional (or less specific) broadcast last as a safety net.
#
# Example station definition:
#
# station_example:
#   frequency: 88.3
#   conditional_broadcasts:
#     - conditions:
#         variables:
#           quest_maple_delivered: "true"
#           broadcast_q1_news_heard: "false"
#       dialogue:
#         - "radio_news_breaking_report_q1"
#         - "radio_news_report_q1_details"
#       set_variables:
#         broadcast_q1_news_heard: "true"
#
#     - conditions:
#         variables:
#           stage_of_day: [dusk, night]
#       dialogue:
#         - "radio_news_late_night_report"
#
#   default:
#     dialogue: ["radio_news_standard_report_msgid"]
# ------------------------------------------------------------------------------------

station_scrambled_frequency:
  default:
    dialogue: ["radio_static_msgid"]

station_route_rhythms:
  frequency: 94.7
  conditional_broadcasts:
    # Weekend playlist -- listed first so it takes priority over the weekday one
    - conditions:
        variables:
          weekday: [saturday, sunday]
          stage_of_day: "dawn"
      dialogue:
        - "radio_route101_weekend_dawn"

    - conditions:
        variables:
          weekday: [saturday, sunday]
          stage_of_day: "morning"
      dialogue:
        - "radio_route101_weekend_morning"

    - conditions:
        variables:
          weekday: [saturday, sunday]
          stage_of_day: "afternoon"
      dialogue:
        - "radio_route101_weekend_afternoon"

    - conditions:
        variables:
          weekday: [saturday, sunday]
          stage_of_day: "dusk"
      dialogue:
        - "radio_route101_weekend_dusk"

    - conditions:
        variables:
          weekday: [saturday, sunday]
          stage_of_day: "night"
      dialogue:
        - "radio_route101_weekend_night"

    # Weekday playlist -- also the fallback if `weekday` has never been set
    - conditions:
        variables:
          stage_of_day: "dawn"
      dialogue:
        - "radio_route101_weekday_dawn"

    - conditions:
        variables:
          stage_of_day: "morning"
      dialogue:
        - "radio_route101_weekday_morning"

    - conditions:
        variables:
          stage_of_day: "afternoon"
      dialogue:
        - "radio_route101_weekday_afternoon"

    - conditions:
        variables:
          stage_of_day: "dusk"
      dialogue:
        - "radio_route101_weekday_dusk"

    - conditions:
        variables:
          stage_of_day: "night"
      dialogue:
        - "radio_route101_weekday_night"

  default:
    dialogue: ["radio_static_msgid"]
